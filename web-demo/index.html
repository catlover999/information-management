<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="theme-color" content="#0F2942" />
    <title>PantryLens</title>
    <style>
      @font-face {
        font-family: 'Poppins-Regular';
        src: url('../src/assets/fonts/Poppins-Regular.ttf') format('truetype');
        font-weight: 400;
        font-style: normal;
      }
      @font-face {
        font-family: 'Poppins-Italic';
        src: url('../src/assets/fonts/Poppins-Italic.ttf') format('truetype');
        font-weight: 400;
        font-style: italic;
      }
      @font-face {
        font-family: 'Poppins-Medium';
        src: url('../src/assets/fonts/Poppins-Medium.ttf') format('truetype');
        font-weight: 500;
        font-style: normal;
      }
      @font-face {
        font-family: 'Poppins-SemiBold';
        src: url('../src/assets/fonts/Poppins-SemiBold.ttf') format('truetype');
        font-weight: 600;
        font-style: normal;
      }
      @font-face {
        font-family: 'Poppins-Bold';
        src: url('../src/assets/fonts/Poppins-Bold.ttf') format('truetype');
        font-weight: 700;
        font-style: normal;
      }
      @font-face {
        font-family: 'Poppins-ExtraBold';
        src: url('../src/assets/fonts/Poppins-ExtraBold.ttf') format('truetype');
        font-weight: 800;
        font-style: normal;
      }

      * {
        box-sizing: border-box;
        -webkit-tap-highlight-color: transparent;
      }

      html,
      body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        background-color: #071320;
        font-family: 'Poppins-Regular', -apple-system, BlinkMacSystemFont, sans-serif;
        overflow: hidden;
      }

      #root {
        width: 100%;
        height: 100dvh;
        display: flex;
        align-items: center;
        justify-content: center;
      }

      /* Phone frame on desktop viewports; full-bleed native look on mobile phones */
      .phone-viewport {
        width: 100%;
        height: 100dvh;
        display: flex;
        flex-direction: column;
        background-color: #0F2942;
        overflow: hidden;
        position: relative;
      }

      @media (min-width: 600px) {
        body:not(.fullscreen-mode) .phone-viewport {
          width: 402px;
          height: min(874px, 95dvh);
          border-radius: 38px;
          border: 8px solid #1E293B;
          box-shadow: 0 24px 60px rgba(0, 0, 0, 0.65);
        }
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/main.tsx"></script>
  </body>
</html>
